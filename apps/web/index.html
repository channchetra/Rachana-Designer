<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <meta
      name="description"
      content="Rachana Designer - standalone visual drag-and-drop editor for HTML, Markdown and Astro. Animations, wireframes, grid builder, design tokens and WordPress export, all unlocked."
    />
    <title>Rachana Designer</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      body {
        overflow: hidden;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #0d1220;
      }
      #rd-boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 14px;
        color: #7fa2d6;
        font-size: 13px;
        letter-spacing: 0.01em;
      }
      #rd-boot .rd-spinner {
        width: 30px;
        height: 30px;
        border-radius: 999px;
        border: 2px solid #1C4076;
        border-top-color: #26A5DE;
        animation: rd-spin 0.8s linear infinite;
      }
      @keyframes rd-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body class="bg-shell-950 text-slate-200 antialiased">
    <div id="root">
      <div id="rd-boot">
        <img src="./logo.svg" alt="Rachana Designer" style="height: 54px" />
        <div class="rd-spinner"></div>
        <span>Starting Rachana Designer…</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
